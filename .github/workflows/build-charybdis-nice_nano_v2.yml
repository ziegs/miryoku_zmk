name: 'Build Charybdis nice_nano_v2'
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["charybdis_left","charybdis_right","settings_reset"]'
      branches: '["zmkfirmware/zmk/v0.3"]'
